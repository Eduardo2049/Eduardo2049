<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" fill="none" role="img" aria-labelledby="t d">
  <title id="t">Eduardo Felipe, Full Stack Developer</title>
  <desc id="d">Full Stack Developer based in Goiânia, Brazil. Web applications end to end: interfaces, APIs and AI. Now: Software Developer intern at SEAD.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { animation: rise 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    .fade { animation: fade 0.8s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
    @keyframes fade { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
    .blob { animation: drift 19s ease-in-out infinite alternate; }
    .b2 { animation-duration: 25s; animation-direction: alternate-reverse; }
    .b3 { animation-duration: 31s; }
    @keyframes drift { to { transform: translate(-70px, 36px); } }
    .pulse { animation: pulse 2.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { from { opacity: 0.55; transform: scale(1); } to { opacity: 0; transform: scale(2.8); } }
  </style>
  <defs>
    <clipPath id="clip"><rect width="880" height="320" rx="18"/></clipPath>
    <radialGradient id="g1"><stop offset="0" stop-color="#dc2626" stop-opacity="0.28"/><stop offset="1" stop-color="#dc2626" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#d97706" stop-opacity="0.28"/><stop offset="1" stop-color="#d97706" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3"><stop offset="0" stop-color="#9f1239" stop-opacity="0.22"/><stop offset="1" stop-color="#9f1239" stop-opacity="0"/></radialGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="330" y1="0" x2="620" y2="0">
      <stop offset="0" stop-color="#dc2626"/><stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#e3e3ea"/></pattern>
    <linearGradient id="fadeR" x1="0" x2="1"><stop offset="0.35" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <mask id="dotsMask"><rect width="880" height="320" fill="url(#fadeR)"/></mask>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="880" height="320" fill="#ffffff"/>
    <rect width="880" height="320" fill="url(#dots)" mask="url(#dotsMask)"/>
    <g class="blob b1"><circle cx="760" cy="60" r="270" fill="url(#g1)"/></g>
    <g class="blob b2"><circle cx="880" cy="290" r="230" fill="url(#g2)"/></g>
    <g class="blob b3"><circle cx="600" cy="330" r="210" fill="url(#g3)"/></g>
  </g>
  <rect x="0.5" y="0.5" width="879" height="319" rx="17.5" fill="none" stroke="#e3e3ea"/>

  <text class="mono rise" x="48" y="62" font-size="13" letter-spacing="2.5" fill="#6b6b7d">GOIÂNIA, BRAZIL</text>
  <text class="mono rise" x="832" y="62" font-size="13" letter-spacing="1" text-anchor="end" fill="#4a4a5a">eduardof.dev</text>

  <text class="sans rise" style="animation-delay:0.08s" x="44" y="164" font-size="76" font-weight="800" letter-spacing="-3"><tspan fill="#0b0b0e">Eduardo</tspan> <tspan fill="url(#name)">Felipe</tspan></text>
  <text class="mono rise" style="animation-delay:0.18s" x="48" y="206" font-size="16" letter-spacing="2.5" fill="#dc2626">FULL STACK DEVELOPER</text>
  <text class="sans rise" style="animation-delay:0.26s" x="48" y="242" font-size="19" fill="#4a4a5a">Web applications end to end: interfaces, APIs and AI.</text>

  <g class="rise" style="animation-delay:0.36s">
    <rect x="48" y="258" width="350" height="34" rx="17" fill="#f6f6f8" fill-opacity="0.85" stroke="#e3e3ea"/>
    <circle class="pulse" cx="67" cy="275" r="4" fill="#059669"/>
    <circle cx="67" cy="275" r="4" fill="#059669"/>
    <text class="sans" x="82" y="280" font-size="14" fill="#0b0b0e">Now: Software Developer intern at SEAD</text>
  </g>
</svg>
