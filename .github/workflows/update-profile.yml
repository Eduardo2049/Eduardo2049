name: Update profile cards

on:
  schedule:
    - cron: "23 9 * * *" # every day, 06:23 in Brasília
  workflow_dispatch:
  push:
    paths:
      - "profile.config.json"
      - "scripts/**"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: update-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate cards
        run: node scripts/generate.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a personal token (read:user + repo) to include private repositories.
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}

      - name: Commit changes
        run: |
          git add assets
          if git diff --cached --quiet; then
            echo "Cards unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile cards"
          git push origin HEAD:${{ github.ref_name }}
